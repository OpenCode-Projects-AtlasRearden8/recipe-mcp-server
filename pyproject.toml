[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-mcp-server"
version = "1.0.0"
description = "Offline MCP server (Python stdlib, stdio) holding your recipe collection: search by ingredients on hand, scale for a cook-date, and build pantry-aware shopping lists. By Asdale Dynamics, LLC."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["mcp", "recipes", "cooking", "agents", "offline", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Other/Nonlisted Topic",
]

[project.scripts]
recipe-mcp-server = "recipes_mcp.__main__:main"

[tool.setuptools]
packages = ["recipes_mcp"]
